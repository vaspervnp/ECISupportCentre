name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The solution also holds the Android app, which needs the MAUI workload, so test projects run one by one.
      - name: Test
        run: |
          for project in tests/*/*.Tests.csproj; do
            dotnet test "$project" -c Release --logger "trx;LogFilePrefix=$(basename "$project" .csproj)" --results-directory TestResults
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Release, so the assemblies are inside the APK (Debug relies on Fast Deployment).
      # Signed with the default debug key until release signing is set up in M9.
      - name: Build test APK
        run: >
          dotnet publish src/EciSupportCentre.App
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=apk
          -o artifacts/apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: eci-support-centre-apk
          path: artifacts/apk/*-Signed.apk
          if-no-files-found: error
